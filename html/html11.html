<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Program 11 - Internal and External CSS</title>

    <link rel="stylesheet" href="external11.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .internal {
            color: blue;
            background-color: #e3f2fd;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .example {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to Programs</a>
</nav>


    <div class="container">

        <h1>Internal and External CSS</h1>

        <div class="example">
            <h2>Internal CSS</h2>

            <p class="internal">
                This paragraph is styled using Internal CSS.
            </p>
        </div>

        <div class="example">
            <h2>External CSS</h2>

            <p class="external">
                This paragraph is styled using External CSS.
            </p>
        </div>

    </div>

</body>
</html>
