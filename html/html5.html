<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Program 5 - Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .form-container {
            width: 500px;
            max-width: 100%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        .gender {
            width: auto;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            width: auto;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to Programs</a>
</nav>


    <div class="form-container">

        <h1>Student Registration Form</h1>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">

            <label for="course">Course</label>
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="BBA">BBA</option>
            </select>

            <label>Gender</label>

            <input class="gender" type="radio" id="male" name="gender" value="Male">
            <label for="male" style="display:inline;">Male</label>

            <input class="gender" type="radio" id="female" name="gender" value="Female">
            <label for="female" style="display:inline;">Female</label>

            <label for="address">Address</label>
            <textarea id="address" name="address"></textarea>

            <div class="buttons">
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
            </div>

        </form>

    </div>

</body>
</html>
