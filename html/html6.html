<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Program 6 - Audio and Video</title>

    <style>
        body {
            font-family: Arial, sans-serif;

<nav>
