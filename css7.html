<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Program 7 - CSS Gradients</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 30px;
    background-color: #f2f2f2;
}

.container {
    max-width: 900px;
    margin: auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: darkblue;
    margin-bottom: 30px;
}

.box {
    height: 180px;
    margin-bottom: 25px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

/* Linear Gradient */
.linear {
    background: linear-gradient(to right, #2196F3, #00BCD4);
}

/* Linear Gradient with Multiple Colors */
.linear-multiple {
    background: linear-gradient(to right, #ff512f, #dd2476, #7b2ff7);
}

/* Radial Gradient */
.radial {
    background: radial-gradient(circle, #ffeb3b, #ff9800, #f44336);
}

/* Radial Gradient with Multiple Colors */
.radial-multiple {
    background: radial-gradient(circle, #ffffff, #90caf9, #1976d2);
}

.description {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}
</style>

</head>

<body>
<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to Programs</a>
</nav>


<div class="container">

    <h1>CSS Gradients</h1>

    <p class="description">
        This webpage demonstrates Linear and Radial CSS gradients.
    </p>

    <div class="box linear">
        Linear Gradient
    </div>

    <div class="box linear-multiple">
        Linear Gradient with Multiple Colors
    </div>

    <div class="box radial">
        Radial Gradient
    </div>

    <div class="box radial-multiple">
        Radial Gradient with Multiple Colors
    </div>

</div>

</body>
</html>
