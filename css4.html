<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Program 4 - CSS Colors</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: darkblue;
    margin-bottom: 30px;
}

.box {
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    text-align: center;
}

.text-color {
    color: green;
    font-size: 22px;
    font-weight: bold;
}

.background-color {
    background-color: lightblue;
    color: darkblue;
}

.border-color {
    border: 4px solid red;
    color: #333;
}

.ui-element {
    background-color: #4CAF50;
    color: white;
    border: 2px solid #2E7D32;
}

.button {
    display: inline-block;
    background-color: #2196F3;
    color: white;
    padding: 12px 25px;
    border-radius: 6px;
    border: 2px solid #1565C0;
    cursor: pointer;
}

.button:hover {
    background-color: #1565C0;
}
</style>
</head>

<body>
<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to Programs</a>
</nav>


<div class="container">

    <h1>CSS Colors</h1>

    <div class="box text-color">
        Text Color
        <p>This text demonstrates CSS color property.</p>
    </div>

    <div class="box background-color">
        Background Color
        <p>This box demonstrates background-color.</p>
    </div>

    <div class="box border-color">
        Border Color
        <p>This box demonstrates border color.</p>
    </div>

    <div class="box ui-element">
        UI Element
        <p>This section uses colors for a user interface element.</p>
    </div>

    <div class="box">
        <h2>Colored Button</h2>
        <div class="button">Click Me</div>
    </div>

</div>

</body>
</html>
