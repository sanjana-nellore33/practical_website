<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Program 6 - CSS Borders</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    color: darkblue;
    margin-bottom: 30px;
}

.box {
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    background-color: #f8f9fa;
    font-size: 18px;
}

.solid {
    border: 4px solid blue;
}

.dashed {
    border: 4px dashed green;
}

.dotted {
    border: 4px dotted red;
}

.double {
    border: 6px double purple;
}

.thick {
    border-style: solid;
    border-width: 8px;
    border-color: orange;
}

.rounded {
    border: 4px solid #2196F3;
    border-radius: 20px;
}

.circle {
    width: 150px;
    height: 150px;
    margin: 20px auto;
    border: 5px solid #4CAF50;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #e8f5e9;
    font-weight: bold;
}

.custom {
    border: 4px solid #333;
    border-radius: 5px 25px 5px 25px;
}
</style>
</head>

<body>
<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">Back to Programs</a>
</nav>


<div class="container">

    <h1>CSS Border Properties</h1>

    <div class="box solid">
        Solid Border
    </div>

    <div class="box dashed">
        Dashed Border
    </div>

    <div class="box dotted">
        Dotted Border
    </div>

    <div class="box double">
        Double Border
    </div>

    <div class="box thick">
        Thick Border
    </div>

    <div class="box rounded">
        Rounded Border using border-radius
    </div>

    <div class="circle">
        Circle
    </div>

    <div class="box custom">
        Custom Rounded Corners
    </div>

</div>

</body>
</html>
